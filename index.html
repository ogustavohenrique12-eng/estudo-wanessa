<script>
'use strict';
const MISSIONS = [
 {id:'governanca',title:'Governança e stakeholders',desc:'Ética, transparência, princípios e públicos da organização.',emoji:'🏛️',tint:'#ece7ff'},
 {id:'riscos',title:'Descubra o tipo de risco',desc:'Seis categorias e exemplos fáceis de diferenciar.',emoji:'🎯',tint:'#fff0df'},
 {id:'gestao',title:'Gerencie antes da crise',desc:'Matriz de riscos, contingência, mitigação e monitoramento.',emoji:'🛡️',tint:'#e2f7ee'},
 {id:'ouvidoria',title:'Ouvidoria e compliance',desc:'Canais de escuta, manifestações e integridade.',emoji:'💬',tint:'#ffe9f1'},
 {id:'comunicacao',title:'Comunicação interna na prática',desc:'Transparência, escuta, ruídos e casos reais da atividade.',emoji:'📣',tint:'#e7f1ff'}
];
// Perguntas adaptadas dos slides de Gestão de riscos e da Atividade Comunicação Interna.
// Formato: id, missão, pergunta, alternativas, índice correto, explicação, pista.
const Q = [
 {id:'g1',m:'governanca',q:'Para que serve a governança corporativa?',a:['Somente para organizar as redes sociais da empresa.','Para dirigir, monitorar e controlar a organização com responsabilidade.','Para eliminar a concorrência.','Para substituir a comunicação interna.'],c:1,e:'A governança organiza como a empresa é dirigida, monitorada e responsabilizada por suas decisões.',h:'Pense em quem decide, quem fiscaliza e quem presta contas.'},
 {id:'g2',m:'governanca',q:'Quando uma empresa comunica fatos relevantes com clareza, pratica qual princípio?',a:['Equidade.','Risco estratégico.','Transparência.','Contingência.'],c:2,e:'Transparência é informar com clareza, indo além de comunicar apenas o estritamente obrigatório.',h:'É o princípio ligado a informação clara.'},
 {id:'g3',m:'governanca',q:'O que significa equidade na governança?',a:['Tratar os públicos com justiça, respeitando suas necessidades.','Dar exatamente a mesma tarefa a todos.','Publicar todos os dados privados da empresa.','Ter sempre o maior lucro possível.'],c:0,e:'Equidade é o tratamento justo das partes interessadas, evitando privilégios indevidos.',h:'A palavra-chave é justiça.'},
 {id:'g4',m:'governanca',q:'A diretoria explica suas decisões e assume os resultados. Isso é...',a:['SAC.','Accountability (prestação de contas).','Risco de mercado.','Ombudsman.'],c:1,e:'Prestação de contas, ou accountability, significa explicar e assumir a responsabilidade pelos atos e resultados.',h:'Quem decide precisa responder pelo que fez.'},
 {id:'g5',m:'governanca',q:'Quem são os stakeholders?',a:['Apenas os diretores da companhia.','Somente os acionistas.','Todos que podem afetar ou ser afetados pela organização.','Exclusivamente os consumidores finais.'],c:2,e:'São as partes interessadas: colaboradores, clientes, fornecedores, investidores, governo, comunidades e outros públicos.',h:'A expressão significa partes interessadas.'},
 {id:'g6',m:'governanca',q:'Qual escândalo do início dos anos 2000 é citado nos slides?',a:['Enron, ligada a manipulações contábeis.','Twitter, ligado a demissões.','Google, ligado a protestos.','Airbnb, ligado à pandemia.'],c:0,e:'A apresentação cita Enron, Arthur Andersen, WorldCom e Parmalat como exemplos que impulsionaram o debate sobre governança.',h:'O caso é ligado a fraudes contábeis.'},
 {id:'g7',m:'governanca',q:'A Lei Sarbanes-Oxley (SOX), de 2002, buscou principalmente...',a:['Criar plataformas de mensagens.','Fortalecer controles e a confiança nas informações financeiras.','Definir o salário de todos os funcionários.','Proibir a existência de riscos.'],c:1,e:'A SOX surgiu após escândalos empresariais, reforçando controles internos e a responsabilidade da alta administração.',h:'Pense na reação do mercado a escândalos contábeis.'},
 {id:'g8',m:'governanca',q:'No ESG, a letra G representa...',a:['Gestão de vendas.','Garantia financeira.','Governança: ética, transparência e conduta da empresa.','Geografia do mercado.'],c:2,e:'No ESG, o G corresponde a Governance (governança), relacionado a ética, transparência e práticas de gestão.',h:'É o mesmo tema dos princípios de direção e controle.'},
 {id:'r1',m:'riscos',q:'O sistema interno de pedidos para de funcionar durante o expediente. Qual o risco?',a:['Operacional.','De mercado.','Reputacional.','Estratégico.'],c:0,e:'Riscos operacionais surgem de falhas em processos, pessoas, rotinas ou sistemas.',h:'Afeta o funcionamento do dia a dia.'},
 {id:'r2',m:'riscos',q:'Uma empresa perde dinheiro porque muitos clientes não pagaram. Qual o risco?',a:['Reputacional.','Financeiro.','Estratégico.','De conformidade.'],c:1,e:'Inadimplência e perdas de recursos são exemplos de riscos financeiros.',h:'O impacto direto é no dinheiro da empresa.'},
 {id:'r3',m:'riscos',q:'Um novo concorrente chega com preços bem menores. Qual risco aparece?',a:['Operacional.','De conformidade.','De mercado.','De ouvidoria.'],c:2,e:'Riscos de mercado envolvem concorrência, variações do ambiente econômico e mudanças nas condições de mercado.',h:'Tem relação com concorrentes e economia.'},
 {id:'r4',m:'riscos',q:'Um vídeo de uma falha da empresa viraliza e prejudica sua credibilidade. Qual risco?',a:['Financeiro.','Reputacional.','Operacional.','Estratégico.'],c:1,e:'O risco reputacional atinge imagem, credibilidade e confiança na organização.',h:'O problema principal é a imagem pública.'},
 {id:'r5',m:'riscos',q:'Uma empresa descumpre uma norma e recebe multa. Qual o risco?',a:['De conformidade.','De mercado.','Operacional.','Financeiro somente.'],c:0,e:'Risco de conformidade é a possibilidade de descumprir leis, regulamentos e regras, com consequências como multas ou processos.',h:'Pense em estar ou não dentro das regras.'},
 {id:'r6',m:'riscos',q:'A empresa investe em um novo negócio sem planejamento e a estratégia fracassa. Qual risco?',a:['Reputacional.','Operacional.','Estratégico.','De ouvidoria.'],c:2,e:'Riscos estratégicos têm relação com decisões de negócio que falham em sua execução ou não atingem objetivos.',h:'A palavra-chave é decisão de negócio.'},
 {id:'r7',m:'riscos',q:'A gestão de riscos serve para...',a:['Garantir que nada dará errado.','Reconhecer, avaliar, reduzir e acompanhar incertezas.','Esconder possíveis problemas.','Agir apenas depois de uma crise.'],c:1,e:'Os slides ressaltam que eliminar todos os riscos é impossível. O importante é reconhecê-los e preparar respostas.',h:'Não dá para eliminar 100% dos riscos.'},
 {id:'r8',m:'riscos',q:'Riscos podem surgir de onde?',a:['Apenas de fatores externos.','Somente de funcionários.','De fatores internos e externos.','Exclusivamente de decisões financeiras.'],c:2,e:'Falhas de processos são fatores internos; crises econômicas e concorrência são exemplos de fatores externos.',h:'Compare uma falha de sistema com uma crise econômica.'},
 {id:'g9',m:'gestao',q:'Qual a primeira etapa no gerenciamento dos riscos?',a:['Monitoramento.','Identificação.','Comunicado final.','Recuperação.'],c:1,e:'Primeiro a organização identifica o que pode dar errado. Depois avalia, mitiga e monitora.',h:'Não dá para avaliar algo que ainda não foi reconhecido.'},
 {id:'g10',m:'gestao',q:'Na matriz de riscos, o que é combinado?',a:['Probabilidade e impacto.','Vendas e número de clientes.','Salário e cargo.','Elogios e comentários.'],c:0,e:'A matriz permite priorizar riscos pela chance de acontecerem (probabilidade) e pela gravidade da consequência (impacto).',h:'Chance de acontecer + gravidade do dano.'},
 {id:'g11',m:'gestao',q:'O que significa mitigação?',a:['Ignorar uma situação delicada.','Impedir que pessoas façam reclamações.','Criar medidas para diminuir a chance ou os efeitos do risco.','Dar publicidade a um problema.'],c:2,e:'Mitigar é reduzir a probabilidade de ocorrência ou o impacto de um risco.',h:'É diminuir — não necessariamente eliminar — o risco.'},
 {id:'g12',m:'gestao',q:'O que é plano de contingência?',a:['Um plano para agir quando um problema ou crise acontecer.','Um relatório apenas com elogios.','Uma campanha de vendas.','A lista dos principais concorrentes.'],c:0,e:'O plano de contingência define previamente o que fazer diante de uma crise, inclusive responsáveis e procedimentos.',h:'É o famoso “e se acontecer, como vamos agir?”.'},
 {id:'g13',m:'gestao',q:'A empresa revisa os riscos todos os meses. Isso é...',a:['Prestação de contas.','Monitoramento.','Equidade.','Simplifique.'],c:1,e:'Monitorar é acompanhar e revisar os riscos continuamente para manter a empresa preparada.',h:'Tem relação com acompanhamento contínuo.'},
 {id:'g14',m:'gestao',q:'Em uma crise reputacional, qual conduta os slides recomendam?',a:['Ignorar comentários em redes sociais.','Não treinar a equipe para evitar custos.','Monitorar SAC e temas sensíveis em redes sociais.','Apagar automaticamente todas as reclamações.'],c:2,e:'A apresentação recomenda atenção ao SAC, comentários e temas sensíveis, além de equipe treinada e fluxos definidos.',h:'Ouvir os sinais antes que a crise cresça.'},
 {id:'g15',m:'gestao',q:'O que são “lições aprendidas” após uma crise?',a:['Avaliar o ocorrido para melhorar a resposta a crises futuras.','Esquecer rapidamente o problema.','Transferir sempre a culpa a terceiros.','Encerrar o contato com clientes.'],c:0,e:'A última etapa destacada nas anotações é aprender com erros e acertos para evitar a repetição de falhas.',h:'A crise precisa produzir aprendizado.'},
 {id:'g16',m:'gestao',q:'Depois de uma crise, a empresa deve...',a:['Parar de acompanhar impactos.','Avaliar impactos e planejar a recuperação.','Desconsiderar os riscos antigos.','Falar somente com investidores.'],c:1,e:'Os slides indicam contenção, plano de recuperação, avaliação dos impactos e monitoramento.',h:'A resposta continua depois do auge do problema.'},
 {id:'o1',m:'ouvidoria',q:'Qual a função principal da ouvidoria?',a:['Apenas vender serviços.','Receber manifestações, mediar conflitos e encaminhar soluções.','Criar campanhas publicitárias.','Definir todas as metas comerciais.'],c:1,e:'A ouvidoria funciona como ponte de diálogo entre a organização e seus públicos, inclusive quando outros canais não resolveram a questão.',h:'É um canal de escuta e mediação.'},
 {id:'o2',m:'ouvidoria',q:'Uma pessoa relata que um serviço foi ruim. Isso é...',a:['Elogio.','Solicitação.','Reclamação.','Denúncia obrigatoriamente.'],c:2,e:'Reclamação expressa insatisfação com um serviço prestado.',h:'Existe insatisfação com o atendimento.'},
 {id:'o3',m:'ouvidoria',q:'Uma pessoa informa uma possível irregularidade na organização. Qual manifestação?',a:['Denúncia.','Elogio.','Sugestão.','Solicitação.'],c:0,e:'Denúncia comunica possível ato ilícito ou irregularidade que precisa ser analisada.',h:'Não é só insatisfação; há suspeita de irregularidade.'},
 {id:'o4',m:'ouvidoria',q:'Alguém quer propor uma ideia para melhorar um serviço. Qual manifestação?',a:['Reclamação.','Sugestão.','Denúncia.','Elogio.'],c:1,e:'Sugestão é uma ideia ou proposta de melhoria dos serviços.',h:'A pessoa está propondo algo novo.'},
 {id:'o5',m:'ouvidoria',q:'No material da aula, “Simplifique” é uma manifestação para...',a:['Aumentar a burocracia.','Reportar uma fraude.','Propor a simplificação de algum serviço.','Solicitar demissão.'],c:2,e:'Simplifique é o tipo de manifestação voltada a ideias para tornar serviços e processos mais simples.',h:'O próprio nome indica tornar mais simples.'},
 {id:'o6',m:'ouvidoria',q:'O profissional que atua na mediação de conflitos é chamado de...',a:['Ombudsman ou ouvidor.','Analista de mercado.','Acionista.','Auditor exclusivamente.'],c:0,e:'Ombudsman ou ouvidor recebe manifestações e atua na mediação de conflitos.',h:'É o nome de quem trabalha na ouvidoria.'},
 {id:'o7',m:'ouvidoria',q:'Compliance significa...',a:['Aumentar as vendas a qualquer custo.','Estar em conformidade com leis, regras e padrões éticos.','Substituir toda a liderança.','Evitar contato com stakeholders.'],c:1,e:'Compliance é o sistema de conformidade com legislação, regulamentação, regras internas e padrões éticos.',h:'O verbo inglês comply se relaciona a cumprir regras.'},
 {id:'o8',m:'ouvidoria',q:'Qual documento estabelece princípios e comportamentos esperados?',a:['Matriz de riscos.','Calendário comercial.','Código de Ética ou Conduta.','Pesquisa de satisfação apenas.'],c:2,e:'O Código de Ética (ou Conduta) apresenta princípios, valores e padrões de comportamento adotados pela organização.',h:'O nome do documento tem relação com a maneira de agir.'},

 {id:'c3',m:'comunicacao',q:'Na atividade, qual empresa viveu incertezas internas antes de demissões, em 2022?',a:['Airbnb.','Google.','Twitter.','Boeing.'],c:2,e:'No Twitter, após a compra por Elon Musk, empregados buscaram pistas sobre os planos da gestão fora dos canais internos.',h:'É a plataforma que mudou de nome para X.'},
 {id:'c4',m:'comunicacao',q:'A Better.com foi criticada, em 2021, por...',a:['Anunciar demissões de cerca de 900 pessoas numa chamada coletiva por Zoom.','Desligar um sistema de pedidos.','Vender produtos com defeito.','Criar um novo canal de escuta.'],c:0,e:'O exemplo destaca como uma comunicação pouco cuidadosa pode agravar uma decisão difícil e prejudicar a confiança.',h:'Pense em falta de empatia ao comunicar desligamentos.'},

const def={completed:[],best:{},mastered:[],solved:[],wrong:[],xp:0,attempts:0,correct:0};
let saved;
try{saved=JSON.parse(localStorage.getItem('radar_prova_v1')||'null')||{};}catch(_){saved={};}
let data={...def,...saved};
for(const key of ['completed','mastered','solved','wrong']) if(!Array.isArray(data[key])) data[key]=[];

let page='home',session=null,flashIndex=0,flipped=false,showHint=false;
function save(){try{localStorage.setItem('radar_prova_v1',JSON.stringify(data));}catch(_){}}
function shuffle(a){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,v=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[v]));}
function pct(a,b){return b?Math.round(a/b*100):0;}
function nav(which){page=which;session=null;render();window.scrollTo({top:0,behavior:'smooth'});}
function topTabs(){const tabs=[['home','🗺️ Missões'],['flash','🃏 Cartas'],['cases','🎭 Casos práticos'],['exam','🏆 Simulado'],['errors','🔁 Revisar erros'],['gloss','📖 Guia rápido']];return `<nav class="tabs" aria-label="Modos de estudo">${tabs.map(([k,t])=>`<button class="tab ${page===k?'active':''}" data-action="nav" data-to="${k}" aria-current="${page===k?'page':'false'}">${t}</button>`).join('')}</nav>`;}
function header(){let done=data.completed.filter(k=>MISSIONS.some(m=>m.id===k)).length;return `<section class="hero"><div class="hero-main"><span class="eyebrow">Estude • jogue • acerte</span><h1>Transforme a matéria em conquista. ✨</h1><p>Governança, riscos e comunicação interna em perguntas curtas, explicações simples e exemplos reais. Sem pressão: você aprende jogando.</p><button class="cta" data-action="quick">⚡ Começar treino rápido</button><span class="hero-decor" aria-hidden="true">✦</span></div><div class="progress-card"><div><h2>Seu progresso</h2><div class="big-progress">${done}<span> / ${MISSIONS.length} missões</span></div><div class="meter" aria-label="${pct(done,MISSIONS.length)}% das missões concluídas"><span style="width:${pct(done,MISSIONS.length)}%"></span></div></div><div class="stats"><div class="stat"><b>⚡ ${data.xp}</b><span>XP conquistados</span></div><div class="stat"><b>🃏 ${data.mastered.length}</b><span>Cartas dominadas</span></div></div></div></section>`;}
function home(){return `${header()}${topTabs()}<div class="section-head"><div><h2>Seu mapa de missões</h2><p>Escolha um tema, responda e descubra por que cada resposta está certa.</p></div><span class="section-tag">5 capítulos • ${Q.length} perguntas</span></div><section class="mission-grid">${MISSIONS.map((m,i)=>{let list=Q.filter(q=>q.m===m.id),done=data.completed.includes(m.id),best=data.best[m.id];return `<article class="mission-card"><div class="mission-top"><div class="mission-icon" style="--tint:${m.tint}">${m.emoji}</div><span class="pill ${done?'done':''}">${done?'✓ Concluída':`Missão 0${i+1}`}</span></div><h3>${m.title}</h3><p>${m.desc}</p><div class="card-footer"><small class="small-inline">${list.length} questões${best!=null?' · recorde '+best+'/'+list.length:''}</small><button class="card-link" data-action="mission" data-id="${m.id}">${done?'Rejogar':'Jogar'} →</button></div></article>`;}).join('')}</section><div class="section-head"><div><h2>Estudar de outro jeito</h2><p>Alterne os formatos para memorizar melhor.</p></div></div><section class="feature-grid"><button class="feature-card" data-action="nav" data-to="flash"><span class="feature-icon">🃏</span><strong>Vire as cartas</strong><span>Aprenda conceitos sem precisar decorar textos longos.</span></button><button class="feature-card" data-action="nav" data-to="cases"><span class="feature-icon">🎭</span><strong>Resolva situações</strong><span>Treine exemplos parecidos com os de questões de prova.</span></button><button class="feature-card" data-action="nav" data-to="exam"><span class="feature-icon">🏆</span><strong>Teste seu nível</strong><span>Faça um simulado de 15 perguntas e veja seu resultado.</span></button></section><div class="notice">💡 <b>Como estudar:</b> comece por uma missão, use as cartas para fixar os conceitos e termine com o simulado. As perguntas erradas ficam salvas em “Revisar erros”.</div>`;}
function startSession(kind,id){let items,title,tag;if(kind==='mission'){let m=MISSIONS.find(m=>m.id===id);items=shuffle(Q.filter(q=>q.m===id));title=m.title;tag=m.emoji+' Missão';}else if(kind==='quick'){items=shuffle(Q).slice(0,10);title='Treino rápido';tag='⚡ 10 questões';}else if(kind==='cases'){items=shuffle(CASES);title='Casos práticos';tag='🎭 Escolha a melhor resposta';}else if(kind==='exam'){items=shuffle(Q).slice(0,15);title='Simulado final';tag='🏆 15 questões';}else if(kind==='errors'){items=shuffle([...Q,...CASES].filter(q=>data.wrong.includes(q.id)));title='Revisão dos erros';tag='🔁 Reforce o aprendizado';}if(!items||!items.length){nav('errors');return;}session={kind,id:id||kind,title,tag,items,at:0,selected:null,points:0,history:[],lastXp:0,finished:false};page='game';showHint=false;render();window.scrollTo({top:0,behavior:'smooth'});}
function answer(idx){if(!session||session.finished||session.selected!==null)return;let q=session.items[session.at],yes=idx===q.c;session.selected=idx;session.lastXp=0;session.history.push({q,yes,choice:idx});data.attempts++;if(yes){session.points++;data.correct++;data.wrong=data.wrong.filter(x=>x!==q.id);if(!data.solved.includes(q.id)){data.solved.push(q.id);data.xp+=10;session.lastXp=10;}}else if(!data.wrong.includes(q.id)){data.wrong.push(q.id);}save();render();}
function next(){if(!session||session.selected===null)return;if(session.at>=session.items.length-1){finish();return;}session.at++;session.selected=null;showHint=false;render();window.scrollTo({top:0,behavior:'smooth'});}
function finish(){if(!session)return;session.finished=true;let id=session.id;if(session.kind==='mission'&&!data.completed.includes(id))data.completed.push(id);data.best[id]=Math.max(data.best[id]||0,session.points);save();render();window.scrollTo({top:0,behavior:'smooth'});}
function game(){let s=session;if(!s)return home();if(s.finished)return results();let q=s.items[s.at],answered=s.selected!==null,yes=answered&&s.selected===q.c;let progress=pct(s.at,s.items.length);return `<div class="focus-wrap"><button class="back-link" data-action="leave">← Voltar ao mapa</button><div class="focus-card"><div class="focus-top"><span class="challenge-tag">${escapeHtml(s.tag)}</span><span class="step">Questão ${s.at+1} de ${s.items.length}</span></div><div class="meter" aria-label="${progress}% da atividade concluída"><span style="width:${progress}%"></span></div><span class="kicker">${escapeHtml(s.title)}</span><h1 class="focus-title"><span class="question-icon">${s.kind==='cases'?'🧩':s.kind==='exam'?'🎓':'🤔'}</span>${escapeHtml(q.q)}</h1><div class="options">${q.a.map((a,i)=>{let cls=answered?(i===q.c?'correct':i===s.selected?'wrong':''):'';return `<button class="option ${cls}" data-action="answer" data-index="${i}" ${answered?'disabled':''} aria-label="Alternativa ${'ABCD'[i]}: ${escapeHtml(a)}"><span class="letter">${answered&&i===q.c?'✓':answered&&i===s.selected&&i!==q.c?'×':'ABCD'[i]}</span><span>${escapeHtml(a)}</span></button>`;}).join('')}</div>${answered?`<div class="feedback ${yes?'':'bad'}" role="status"><strong>${yes?'✅ Mandou bem!':'💡 Quase! Vamos entender.'}</strong><p>${escapeHtml(q.e)}</p>${yes&&s.lastXp?'<small>+10 XP pela primeira resposta correta desta questão!</small>':!yes?`<small>Resposta certa: ${escapeHtml(q.a[q.c])}</small>`:''}</div>`:''}${showHint&&!answered?`<div class="hint">💡 <b>Pista:</b> ${escapeHtml(q.h)}</div>`:''}<div class="focus-actions">${answered?`<span class="tiny muted">Acertos nesta rodada: <b>${s.points}</b></span><button class="action-btn" data-action="next">${s.at===s.items.length-1?'Ver meu resultado 🏆':'Próxima questão →'}</button>`:`<button class="hint-btn" data-action="hint">💡 ${showHint?'Pista exibida':'Preciso de uma pista'}</button><span class="small-inline">Teclas 1–4 para responder</span>`}</div></div></div>`;}
function results(){let s=session,n=s.items.length,rate=pct(s.points,n),great=rate>=85,good=rate>=60;let wrong=s.history.filter(x=>!x.yes);return `<div class="focus-wrap"><button class="back-link" data-action="leave">← Voltar ao mapa</button><div class="focus-card"><div class="score-panel"><span class="score-emoji">${great?'🏆':good?'🌟':'💪'}</span><h2>${great?'Você arrasou!':good?'Muito bem, continue!':'Você está aprendendo!'}</h2><p>${great?'Excelente domínio! Revise os conceitos que ainda geraram dúvida.':good?'Um ótimo caminho. Repassar os erros vai ajudar a fixar.':'Errar faz parte do estudo. Revise as explicações e tente novamente.'}</p><div class="score-circle" style="--score:${rate}%"><strong>${rate}%</strong></div><div class="results-grid"><div class="result-stat"><strong>${s.points}/${n}</strong><span>Acertos</span></div><div class="result-stat"><strong>${n-s.points}</strong><span>Erros</span></div><div class="result-stat"><strong>${data.xp}</strong><span>XP total</span></div></div><div class="score-actions"><button class="action-btn" data-action="retry">Jogar novamente ↻</button><button class="secondary-btn" data-action="home">Voltar às missões</button>${data.wrong.length?'<button class="secondary-btn" data-action="review">Revisar erros 🔁</button>':''}</div>${wrong.length?`<div class="recap"><h3>Questões para reforçar (${wrong.length})</h3>${wrong.map(x=>`<details><summary>${escapeHtml(x.q.q)}</summary><p><b>Resposta:</b> ${escapeHtml(x.q.a[x.q.c])}</p><p>${escapeHtml(x.q.e)}</p></details>`).join('')}</div>`:'<div class="tip-row">🎉 Rodada perfeita! Tente os casos práticos para aplicar o que aprendeu.</div>'}</div></div></div>`;}
function flashPage(){let [term,defi,ex]=FLASH[flashIndex],master=data.mastered.includes(flashIndex);return `${topTabs()}<div class="section-head"><div><h2>Cartas de memória 🃏</h2><p>Leia o conceito, tente explicar com suas palavras e toque para revelar.</p></div><span class="section-tag">${data.mastered.length} de ${FLASH.length} dominadas</span></div><div class="flash-layout"><div class="flash-counter">Carta ${flashIndex+1} de ${FLASH.length}</div><button class="flashcard ${flipped?'flipped':''}" data-action="flip" aria-label="Virar cartão de estudo"><div class="flashcard-inner"><div class="flash-face flash-front"><span class="label">O que é?</span><h2>${escapeHtml(term)}</h2><span class="tap">↻ Toque para revelar a resposta</span></div><div class="flash-face flash-back"><span class="label">Significado</span><h2>${escapeHtml(defi)}</h2><p>🧠 ${escapeHtml(ex)}</p><span class="tap">↻ Toque para ver o termo novamente</span></div></div></button><div class="flash-actions"><button class="secondary-btn" data-action="flashprev">← Anterior</button><button class="action-btn" data-action="master">${master?'✓ Já sei esta':'✅ Entendi esta'}</button><button class="secondary-btn" data-action="flashnext">Próxima →</button></div><div class="flash-mastered">${master?'✓ Você já marcou esta carta como dominada.':'Estude no seu ritmo — uma carta por vez.'}</div><div class="meter"><span style="width:${pct(data.mastered.length,FLASH.length)}%"></span></div><div class="tip-row">💡 Técnica: tente dar um exemplo próprio antes de virar o cartão. Isso ajuda a lembrar na hora da prova.</div></div>`;}
function casesPage(){return `${topTabs()}<div class="section-head"><div><h2>Casos práticos 🎭</h2><p>Você recebe uma situação e precisa identificar o conceito envolvido.</p></div></div><div class="mode-banner"><span class="mode-emoji">🧩</span><div><h3>Desafio dos cenários</h3><p>${CASES.length} situações de empresa com explicação imediata.</p></div><button class="action-btn" data-action="casesstart">Começar →</button></div><div class="tip-row">💡 Alguns casos se parecem com os exemplos da atividade de Comunicação Interna. Foque no tipo de problema e na melhor resposta.</div>`;}
function examPage(){let best=data.best.exam;return `${topTabs()}<div class="section-head"><div><h2>Simulado final 🏆</h2><p>Descubra o quanto você já sabe antes da prova.</p></div></div><div class="mode-banner"><span class="mode-emoji">🎓</span><div><h3>15 perguntas misturadas</h3><p>Questões de todos os capítulos, em ordem aleatória.${best!=null?' Seu melhor resultado: '+best+'/15.':''}</p></div><button class="action-btn" data-action="examstart">Começar →</button></div><div class="notice">🧠 Sem cronômetro e sem penalidade. Você recebe uma explicação após cada resposta. Ao fim, verá seu percentual de acertos.</div>`;}
function errorsPage(){let n=data.wrong.length;return `${topTabs()}<div class="section-head"><div><h2>Revisar erros 🔁</h2><p>As questões que você errou ficam aqui para um novo treino.</p></div></div>${n?`<div class="mode-banner"><span class="mode-emoji">🔁</span><div><h3>${n} ${n===1?'questão para reforçar':'questões para reforçar'}</h3><p>Quando acertar uma questão, ela sai desta lista automaticamente.</p></div><button class="action-btn" data-action="review">Treinar erros →</button></div>`:`<div class="empty-state"><span class="big">✨</span><h3>Nenhum erro pendente!</h3><p>Continue jogando. Se errar alguma questão, ela aparece aqui para você praticar.</p><button class="action-btn" data-action="quick">Treino rápido →</button></div>`}`;}
function glossPage(){return `${topTabs()}<div class="section-head"><div><h2>Guia rápido de conceitos 📖</h2><p>Um resumo de bolso: toque em um termo para revelar a explicação.</p></div></div><div class="glossary-grid">${GLOSS.map(([term,ex])=>`<details class="term"><summary>${escapeHtml(term)}</summary><p>${escapeHtml(ex)}</p></details>`).join('')}</div><div class="notice">📌 <b>Para decorar em uma frase:</b> governança dirige, riscos antecipam problemas, ouvidoria escuta, compliance garante conformidade e comunicação interna conecta pessoas.</div>`;}
function render(){let content=page==='game'?game():page==='home'?home():page==='flash'?flashPage():page==='cases'?casesPage():page==='exam'?examPage():page==='errors'?errorsPage():glossPage();$('#app').innerHTML=content+`<footer class="credits">Conteúdo de estudo baseado nos materiais da professora Wanessa e na atividade de Comunicação Interna. <span aria-hidden="true">•</span> Dados salvos apenas neste navegador.<br><button class="reset" data-action="reset">Reiniciar meu progresso</button></footer>`;document.title=(page==='game'&&session?session.title+' — ':'')+'Radar da Prova';}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;switch(a){case'home':nav('home');break;case'nav':nav(b.dataset.to);break;case'mission':startSession('mission',b.dataset.id);break;case'quick':startSession('quick');break;case'casesstart':startSession('cases');break;case'examstart':startSession('exam');break;case'review':startSession('errors');break;case'answer':answer(Number(b.dataset.index));break;case'next':next();break;case'leave':nav('home');break;case'hint':showHint=!showHint;render();break;case'retry':if(session)startSession(session.kind,session.id);break;case'flip':flipped=!flipped;render();break;case'flashprev':flashIndex=(flashIndex-1+FLASH.length)%FLASH.length;flipped=false;render();break;case'flashnext':flashIndex=(flashIndex+1)%FLASH.length;flipped=false;render();break;case'master':if(!data.mastered.includes(flashIndex)){data.mastered.push(flashIndex);save();}flashIndex=(flashIndex+1)%FLASH.length;flipped=false;render();break;case'reset':if(confirm('Deseja realmente apagar suas missões, XP, cartas dominadas e histórico de erros neste navegador?')){data={...def,best:{},completed:[],mastered:[],solved:[],wrong:[]};save();nav('home');}break;}});
document.addEventListener('keydown',e=>{if(page!=='game'||!session||session.finished||e.altKey||e.ctrlKey||e.metaKey)return;if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(session.selected===null&&['1','2','3','4'].includes(e.key)){e.preventDefault();answer(Number(e.key)-1);}else if(session.selected!==null&&e.key==='Enter'){e.preventDefault();next();}});
render();
</script>
</body>
</html>
